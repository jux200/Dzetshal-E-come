<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track Order | Dzetshal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#224c44;--p:#f8b38f;--bg:#f7f4f0;--bd:#e5ddd5;--muted:#777}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17211f}.track-head{background:#fff;border-bottom:1px solid var(--bd);padding:15px 5vw;display:flex;align-items:center;justify-content:space-between;gap:15px}.track-brand{display:flex;align-items:center;gap:12px}.track-emblem{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:var(--p);border:2px solid var(--p);font-family:serif;font-size:27px}.track-brand img{width:175px;max-width:42vw;height:auto}.track-head a{color:var(--g);font-weight:700;text-decoration:none}.wrap{width:min(950px,92vw);margin:38px auto}.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:38px;color:var(--g);margin:0 0 8px}.hero p{color:var(--muted)}.card{background:#fff;border:1px solid var(--bd);border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.08);padding:24px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g);margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;font-size:15px}.btn{border:0;border-radius:12px;background:var(--g);color:#fff;padding:14px 22px;font-weight:800;align-self:end;cursor:pointer}.result{margin-top:22px;display:none}.order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:16px}.badge{padding:8px 12px;border-radius:999px;background:#eef5f2;color:var(--g);font-weight:800;text-transform:capitalize}.badge.cancelled{background:#ffe3e3;color:#b42d2d}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.meta>div{background:#faf8f5;padding:15px;border-radius:14px}.meta small{display:block;color:var(--muted);margin-bottom:5px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:22px 0}.step{text-align:center;position:relative}.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;border:2px solid #d4cbc2;background:#fff;color:#aaa;font-weight:900}.step.done .dot{background:var(--g);border-color:var(--g);color:#fff}.step.active .dot{box-shadow:0 0 0 5px rgba(34,76,68,.14)}.step span{font-size:11px;font-weight:700;color:#777}.history{border-top:1px solid var(--bd);padding-top:12px}.history-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--bd)}.empty,.error{padding:18px;text-align:center;color:var(--muted)}.error{color:#b42d2d}.items{margin-top:15px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
@media(max-width:720px){.form{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.card{padding:17px}.track-brand img{width:135px}}
</style></head><body>
<header class="track-head"><div class="track-brand"><div class="track-emblem">D</div><img id="brandLogo" src="img/brand-logo-green.png" alt="Dzetshal"></div><a href="index.html">Back to shop</a></header>
<main class="wrap"><div class="hero"><h1>Track Your Order</h1><p>Enter your order number and the email address or phone number used at checkout.</p></div>
<section class="card"><form id="trackForm" class="form"><div class="field"><label>Order number</label><input id="orderNumber" required placeholder="DZ-2026-01003"></div><div class="field"><label>Email or phone</label><input id="contact" required placeholder="name@email.com or 078..."></div><button class="btn" type="submit">Track Order</button></form><div id="message"></div><div id="result" class="result"></div></section></main>
<script>
const sb=supabase.createClient('https://tnaigjnroawduaznmmuc.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuYWlnam5yb2F3ZHVhem5tbXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4Mjk3NTQsImV4cCI6MjA5ODQwNTc1NH0.vRFpibtvIIfAHwBb4ADHEwrjeT70K0P42nCCf0wIi9Q');
const labels={pending:'Order received',confirmed:'Payment confirmed',preparing:'Preparing',ready:'Ready for pickup',ready_for_pickup:'Ready for pickup',out_for_delivery:'Picked up / sent',shipped:'Picked up / sent',sent_via_transport:'Picked up / sent',delivered:'Delivered'};
const order=['pending','confirmed','preparing','ready','out_for_delivery','delivered'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){return 'RWF '+Number(v||0).toLocaleString()}
async function loadBrand(){try{const {data}=await sb.from('theme_settings').select('logo_theme,logo_size,show_store_name').eq('id','main').maybeSingle(); brandLogo.src=data?.logo_theme==='peach'?'img/brand-logo-peach.png':'img/brand-logo-green.png'; brandLogo.style.width=Math.max(110,Math.min(230,Number(data?.logo_size||175)))+'px'; brandLogo.style.display=data?.show_store_name===false?'none':'block'}catch(e){}}
function normalizeStatus(o){const s=String(o.status||o.delivery_status||'pending').toLowerCase(); if(['cancelled','canceled','refunded'].includes(s))return 'cancelled'; if(String(o.payment_status||'').toLowerCase()==='paid'&&s==='pending')return 'confirmed'; if(['ready_for_pickup'].includes(s))return 'ready'; if(['sent_via_transport','shipped'].includes(s))return 'out_for_delivery'; return s}
trackForm.addEventListener('submit',async e=>{e.preventDefault();message.innerHTML='<div class="empty">Checking your order…</div>';result.style.display='none';const {data,error}=await sb.rpc('track_customer_order',{p_order_number:orderNumber.value.trim(),p_contact:contact.value.trim()}); if(error||!data){message.innerHTML='<div class="error">Order not found. Check the order number and email or phone.</div>';return}message.innerHTML='';render(data)});
function render(d){const o=d.order||d;const st=normalizeStatus(o);const idx=order.indexOf(st);const cancelled=st==='cancelled';const items=Array.isArray(d.items)?d.items:(Array.isArray(o.items)?o.items:[]);result.innerHTML=`<div class="order-top"><div><strong>${esc(o.order_number)}</strong><div>${new Date(o.created_at).toLocaleString()}</div></div><span class="badge ${cancelled?'cancelled':''}">${cancelled?'Cancelled':esc(labels[st]||st)}</span></div><div class="meta"><div><small>Payment</small><strong>${esc(o.payment_method||'Not specified')}</strong><br>${esc(o.payment_status||'pending')}</div><div><small>Delivery</small><strong>${esc(o.delivery_method||'pickup')}</strong><br>${esc(o.transport_destination||o.city||'')}</div><div><small>Total</small><strong>${money(o.total)}</strong></div></div>${cancelled?'<div class="error">This order has been cancelled.</div>':`<div class="steps">${order.map((s,i)=>`<div class="step ${i<=idx?'done':''} ${i===idx?'active':''}"><div class="dot">${i<=idx?'✓':i+1}</div><span>${labels[s]}</span></div>`).join('')}</div>`}<div class="items"><h3>Order summary</h3>${items.length?items.map(i=>`<div class="item"><span>${esc(i.product_name||i.name)} × ${Number(i.quantity||1)}</span><strong>${money(i.line_total||Number(i.unit_price||i.price||0)*Number(i.quantity||1))}</strong></div>`).join(''):'<div class="empty">Order item details are not available.</div>'}</div><div class="history"><h3>Status history</h3>${(d.history||[]).length?(d.history||[]).map(h=>`<div class="history-row"><strong>${esc(labels[h.status]||h.status)}</strong><span>${new Date(h.created_at).toLocaleString()}</span></div>`).join(''):'<div class="empty">No status history yet.</div>'}</div>`;result.style.display='block'}
const qp=new URLSearchParams(location.search).get('order');if(qp)orderNumber.value=qp;loadBrand();
</script></body></html>
