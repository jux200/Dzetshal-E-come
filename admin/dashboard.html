<!DOCTYPE html><html><head><title>Dashboard</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'>
<link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500;700;800&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='css/admin.css'>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/supabase-client.js'></script><script src='js/common.js'></script></head><body><div class='app'><aside class='sidebar' id='sidebar'><div class='side-brand'><h2>Dzet<span>shal</span></h2><p>Admin Panel</p></div><nav class='nav'>
<a href='dashboard.html' data-page='dashboard'>📊 Dashboard</a><a href='orders.html' data-page='orders'>📦 Orders</a><a href='products.html' data-page='products'>🌸 Products</a><a href='customers.html' data-page='customers'>👥 Customers</a><a href='settings.html' data-page='settings'>⚙️ Settings</a><a href='../index.html'>↗ Storefront</a></nav><div class='side-footer'><button class='btn outline full' id='logoutBtn'>Logout</button></div></aside><main class='main'><header class='topbar'><button class='btn outline small mobile-menu' id='mobileMenu'>☰</button><h1>Dashboard</h1><div class='userbox'><span id='userEmail'></span></div></header><section class='content'><div class='grid stats'><div class='card'><div class='stat-title'>Revenue</div><div class='stat-value' id='revenue'>...</div><div class='stat-sub'>All saved orders</div></div><div class='card'><div class='stat-title'>Orders</div><div class='stat-value' id='ordersCount'>...</div><div class='stat-sub'>Total orders</div></div><div class='card'><div class='stat-title'>Products</div><div class='stat-value' id='productsCount'>...</div><div class='stat-sub'>In database</div></div><div class='card'><div class='stat-title'>Low stock</div><div class='stat-value' id='lowStock'>...</div><div class='stat-sub'>Stock under 5</div></div></div><div class='grid two-col'><div class='card'><h2 class='section-title'>Recent Orders</h2><div class='table-wrap'><table class='table'><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id='recentOrders'></tbody></table></div></div><div class='card'><h2 class='section-title'>Low Stock Products</h2><div id='lowStockList' class='items-box'>Loading...</div></div></div></section></main></div><div id='toast' class='toast'></div><script>document.addEventListener('DOMContentLoaded',()=>{bindShell(); const a=document.querySelector(".nav a[data-page='dashboard']"); if(a)a.classList.add('active')})</script><script src='js/dashboard.js'></script></body></html>
