<!DOCTYPE html><html><head><title>Products</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'>
<link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500;700;800&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='css/admin.css'>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/supabase-client.js'></script><script src='js/common.js'></script></head><body><div class='app'><aside class='sidebar' id='sidebar'><div class='side-brand'><h2>Dzet<span>shal</span></h2><p>Admin Panel</p></div><nav class='nav'>
<a href='dashboard.html' data-page='dashboard'>📊 Dashboard</a><a href='orders.html' data-page='orders'>📦 Orders</a><a href='products.html' data-page='products'>🌸 Products</a><a href='customers.html' data-page='customers'>👥 Customers</a><a href='settings.html' data-page='settings'>⚙️ Settings</a><a href='../index.html'>↗ Storefront</a></nav><div class='side-footer'><button class='btn outline full' id='logoutBtn'>Logout</button></div></aside><main class='main'><header class='topbar'><button class='btn outline small mobile-menu' id='mobileMenu'>☰</button><h1>Products</h1><div class='userbox'><span id='userEmail'></span></div></header><section class='content'><div class='toolbar'><div class='toolbar-left'><input class='search' id='productSearch' placeholder='Search products, brand...'><select id='productStatus'><option value=''>All</option><option value='active'>Active</option><option value='hidden'>Hidden</option></select></div><div class='toolbar-right'><button class='btn primary' id='addProductBtn'>+ Add Product</button><button class='btn outline' id='refreshBtn'>Refresh</button></div></div><div class='table-wrap'><table class='table'><thead><tr><th>Image</th><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id='productsTable'></tbody></table></div><div class='modal' id='productModal'><div class='modal-card'><div class='modal-head'><h2 id='modalTitle'>Add Product</h2><button class='close' onclick="document.getElementById('productModal').classList.remove('open')">×</button></div><form id='productForm' class='form-grid'><input type='hidden' id='pid'><div class='form-group'><label>Name</label><input id='pname' required></div><div class='form-group'><label>Brand</label><input id='pbrand' list='brandOptions' placeholder='Choose or type brand'><datalist id='brandOptions'></datalist></div><div class='form-group'><label>Type</label><select id='ptype'></select></div><div class='form-group'><label>Gender</label><select id='pgender'><option value='women'>Women</option><option value='men'>Men</option><option value='unisex'>Unisex</option></select></div><div class='form-group'><label>Size</label><input id='psize' placeholder='100ml'></div><div class='form-group'><label>Price</label><input id='pprice' type='number' required></div><div class='form-group'><label>Stock</label><input id='pstock' type='number' value='0'></div><div class='form-group'><label>Status</label><select id='pstatus'><option value='active'>active</option><option value='hidden'>hidden</option></select></div><div class='form-group span2'><label>Image URL</label><input id='pimage'></div><div class='form-group span2'><label>Upload Image to Supabase Storage</label><input id='pfile' type='file' accept='image/*' multiple></div><div class='form-group span2'><label>Description</label><textarea id='pdesc'></textarea></div><div class='span2'><div class='media-panel' id='imageManager'><div class='media-head'><div><h3>Product Images</h3><p>Upload multiple images, set the main image, or remove gallery images.</p></div></div><div class='drop-zone' id='dropZone'><strong>Click to upload</strong> or drag images here<input id='galleryFiles' type='file' accept='image/*' multiple></div><div class='upload-progress' id='uploadProgress'><span></span></div><div class='media-grid' id='mediaGrid'></div></div></div><div class='span2 actions'><button class='btn primary' type='submit'>Save Product</button><button class='btn outline' type='button' onclick="document.getElementById('productModal').classList.remove('open')">Cancel</button></div></form></div></div></section></main></div><div id='toast' class='toast'></div><script>document.addEventListener('DOMContentLoaded',()=>{bindShell(); const a=document.querySelector(".nav a[data-page='products']"); if(a)a.classList.add('active')})</script><script src='js/products.js'></script></body></html>
